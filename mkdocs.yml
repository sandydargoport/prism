site_name: Prism
site_description: A subscription-free, self-hosted family dashboard.
site_url: https://sandydargoport.github.io/prism/
repo_url: https://github.com/sandydargoport/prism
repo_name: sandydargoport/prism
edit_uri: edit/master/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/landing.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sandydargoport/prism

nav:
  - Home: index.md
  - Screenshots: screenshots.md
  - Get Started:
      - Install: getting-started/install.md
      - First-time setup: getting-started/first-time-setup.md
      - Updating: getting-started/updating.md
      - Using https at home: getting-started/https.md
  - User Guide:
      - Guide: HELP.md
      - The wall screen: features/DASHBOARD.md
      - Calendar: features/CALENDAR.md
      - Shopping: features/SHOPPING.md
      - Recipes: features/RECIPES.md
      - To-dos: features/TASKS.md
      - Chores: features/CHORES.md
      - Points and rewards: features/GOALS.md
      - Messages: features/MESSAGES.md
      - Wish lists: features/WISHES.md
      - Photos: features/PHOTOS.md
      - Travel map: features/TRAVEL.md
      - Weekend ideas: features/WEEKEND.md
      - School bus: features/BUS.md
      - Birthdays: features/BIRTHDAYS.md
      - Languages: features/LANGUAGES.md
      - Idle, away and sitter screens: features/DISPLAY-MODES.md
      - Looks and colours: features/THEMES.md
      - On your phone: features/MOBILE.md
      - Update check: features/TELEMETRY.md
  - Integrations:
      - Services Prism works with: integrations.md
      - Apple iCloud: features/ICLOUD.md
      - Grocery cart: features/KROGER.md
      - Home Assistant: home-assistant.md
      - Voice and automation API: voice-api.md
  - Releases:
      - Changelog: CHANGELOG.md

# Files present in docs/ but intentionally not in the rendered nav.
# Two reasons something might be here:
#   - Engineering reference (the *-review*, code-review-modalities, etc.)
#   - SEO-only landing pages we want indexed by Google/LLM crawlers but
#     not surfaced to users browsing the docs (alternatives, features-index).
#     They stay in the build → sitemap.xml → are crawlable, but don't
#     appear in the side nav.
not_in_nav: |
  /credits.md
  /planning.md
  /arch-review-v4.md
  /audit-2026-07.md
  /DESIGN.md
  /calendar-cards-design.md
  /code-review-modalities.md
  /decisions-log.md
  /api-auth-levels.md
  /alternatives.md
  /features-index.md
  /features/global-input-system.md
  /demo-deployment.md
