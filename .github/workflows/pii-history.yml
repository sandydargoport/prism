name: PII history sweep

# The gap every other scanner leaves open: they all read the CURRENT tree.
#
# scan-pii.sh, scan-secrets.sh and the hashed denylist all enumerate
# `git ls-files`, so a value that was committed and later deleted is invisible
# to every one of them while staying permanently reachable by object id. That
# is not hypothetical here: the scanner written after a real ping URL leaked
# never swept history, so the object it was built to find stayed reachable.
#
# This sweeps every blob reachable from any ref, plus every commit message and
# author identity, against the same two layers the tracked-file scanners use.
#
# Weekly, not per-push. It reads the whole object store, which takes a minute
# or two, and history only changes when someone rewrites it.
#
# Findings are reported by path and object id, never by value: this log is
# public, and printing the line would republish exactly what is being caught.

on:
  schedule:
    # Mondays, 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: pii-history
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sweep:
    name: History sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Every object, not just the tip. This is the whole point of the job.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Blobs in history (denylist + secret shapes)
        env:
          PRISM_PII_SALT: ${{ secrets.PRISM_PII_SALT }}
        run: |
          if [ -z "$PRISM_PII_SALT" ]; then
            echo "::error::PRISM_PII_SALT is not set - the sweep cannot run."
            exit 1
          fi
          python3 scripts/pii-hashes.py scan-history

      - name: Commit messages and identities, all of them
        if: always()
        env:
          PRISM_PII_SALT: ${{ secrets.PRISM_PII_SALT }}
          PRISM_SCAN_REDACT: "1"
        run: bash scripts/scan-commits.sh --all
