name: PII / Secret Scan

# Server-side gate for the local pre-commit/pre-push scanners: local hooks can
# be bypassed with --no-verify, CI cannot. Runs the built-in PII pattern rules
# (maintainer domain, non-allowlisted emails, private/Tailscale IPs), the
# hostname-in-comment heuristic, and the secret-shape scan on every PR and push
# to master.
#
# Layer 2, the per-maintainer denylist, runs here as HASHES. The list itself
# never reaches GitHub: .github/pii-hashes.txt holds HMAC-SHA256 of each entry
# keyed by PRISM_PII_SALT, so the file is unusable without the salt and the
# salt is meaningless without the file. Storing the plaintext list as a secret
# would have put a concentrated index of a real household inside GitHub, which
# is the opposite of what the list exists to do.
#
# Matches report file and line only, never the value, so a hit cannot
# republish into this public log.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: pii-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: PII / secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A fork PR receives no secrets, so Layer 2 could not run and now fails
    # closed. Skip honestly rather than report a green check that verified
    # only half of what it claims.
    if: github.event.pull_request.head.repo.fork != true
    steps:
      - uses: actions/checkout@v7
      - name: Hashed denylist (Layer 2, no plaintext anywhere)
        env:
          PRISM_PII_SALT: ${{ secrets.PRISM_PII_SALT }}
        run: |
          if [ -z "$PRISM_PII_SALT" ]; then
            # Fail closed. A missing salt used to warn and pass, so rotating,
            # renaming or deleting the secret silently turned Layer 2 into a
            # no-op while this check kept reporting green. A gate that cannot
            # run has not passed. Fork PRs never receive secrets, so they are
            # excluded at the job level rather than papered over here.
            echo "::error::PRISM_PII_SALT is not set - the denylist layer could not run."
            exit 1
          fi
          python3 scripts/pii-hashes.py scan

      - name: PII pattern rules (Layer 1)
        run: bash scripts/scan-pii.sh

      - name: Hostname-in-comment heuristic
        run: bash scripts/scan-hostnames.sh
      - name: Secret-shape scan
        run: bash scripts/scan-secrets.sh

  commits:
    name: Commit messages + metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Same reason as above: this job runs the denylist layer too.
    if: github.event.pull_request.head.repo.fork != true
    steps:
      # The commits being scanned have to be present, and the default
      # fetch-depth of 1 leaves exactly one of them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out what is new
        id: range
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -n "$BASE" ]; then
            echo "range=$BASE..$HEAD" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0{40}$'; then
            echo "range=$BEFORE..$AFTER" >> "$GITHUB_OUTPUT"
          else
            # A brand new branch has no "before". Scan what it adds on top of
            # the default branch rather than every commit that ever existed.
            echo "range=origin/${{ github.event.repository.default_branch }}..$AFTER" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan commit messages, authors and committers
        env:
          PRISM_PII_SALT: ${{ secrets.PRISM_PII_SALT }}
          # This log is public. Report where a match is, never what it is.
          PRISM_SCAN_REDACT: "1"
        run: |
          if [ -z "$PRISM_PII_SALT" ]; then
            echo "::error::PRISM_PII_SALT is not set - the denylist layer could not run."
            exit 1
          fi
          bash scripts/scan-commits.sh "${{ steps.range.outputs.range }}"
