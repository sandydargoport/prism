name: PII / Secret Scan

# Server-side gate for the local pre-commit/pre-push scanners: local hooks can
# be bypassed with --no-verify, CI cannot. Runs the built-in PII pattern rules
# (maintainer domain, non-allowlisted emails, private/Tailscale IPs), the
# hostname-in-comment heuristic, and the secret-shape scan on every PR and push
# to master.
#
# Layer 2, the per-maintainer denylist, runs here as HASHES. The list itself
# never reaches GitHub: .github/pii-hashes.txt holds HMAC-SHA256 of each entry
# keyed by PRISM_PII_SALT, so the file is unusable without the salt and the
# salt is meaningless without the file. Storing the plaintext list as a secret
# would have put a concentrated index of a real household inside GitHub, which
# is the opposite of what the list exists to do.
#
# Matches report file and line only, never the value, so a hit cannot
# republish into this public log.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: pii-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: PII / secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # NOT skipped on fork PRs. Only ONE step here needs a secret; the pattern
    # rules, the hostname heuristic, the secret-shape scan and the screenshot
    # guard are all zero-config. Skipping the whole job on a fork turned "Layer 2
    # cannot run" into "nothing runs at all", on exactly the PRs written by
    # people outside the household. The fork condition belongs on the step that
    # actually depends on the secret, which is where it now sits.
    steps:
      # Full history: the screenshot-provenance step below diffs against the PR
      # base, and the default depth of 1 does not contain it. With a shallow
      # checkout that diff fails, and a swallowed failure reads as "nothing
      # changed", which is the one result this check must never produce.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The only step that needs the salt. A fork PR never receives secrets, so
      # it is skipped there rather than failing closed on a contributor who
      # could never have satisfied it. Everything below still runs.
      - name: Hashed denylist (Layer 2, no plaintext anywhere)
        if: github.event.pull_request.head.repo.fork != true
        env:
          PRISM_PII_SALT: ${{ secrets.PRISM_PII_SALT }}
        run: |
          if [ -z "$PRISM_PII_SALT" ]; then
            # Fail closed. A missing salt used to warn and pass, so rotating,
            # renaming or deleting the secret silently turned Layer 2 into a
            # no-op while this check kept reporting green. A gate that cannot
            # run has not passed. Fork PRs never receive secrets, so they are
            # excluded at the job level rather than papered over here.
            echo "::error::PRISM_PII_SALT is not set - the denylist layer could not run."
            exit 1
          fi
          python3 scripts/pii-hashes.py scan

      - name: PII pattern rules (Layer 1)
        run: bash scripts/scan-pii.sh

      - name: Hostname-in-comment heuristic
        run: bash scripts/scan-hostnames.sh
      - name: Secret-shape scan
        run: bash scripts/scan-secrets.sh

      # Images are the one published surface no scanner in this repo can read.
      # Every text layer skips binaries outright, and docs/demos/ is rendered on
      # the public docs site, so a single hand-taken screenshot of the real
      # dashboard would publish names, events and photos past every control at
      # once. The generated path (refresh-screenshots.yml, an ephemeral seeded
      # database) is therefore the only way in, and this enforces that rather
      # than trusting it.
      - name: Screenshots may only arrive from the refresh workflow
        if: github.event_name == 'pull_request' && github.head_ref != 'chore/refresh-screenshots'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # No `|| true`. If the comparison cannot be made, that is a failure of
          # the check, not a pass: the first version of this step swallowed a
          # "bad object" from a shallow checkout and reported clean.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::error::Cannot resolve the PR base ($BASE), so docs/demos changes could not be checked."
            exit 1
          fi
          # --diff-filter=d: deletions are always safe, and refusing them would
          # block the very PR that removes an unwanted image.
          changed=$(git diff --name-only --diff-filter=d "$BASE" "$HEAD" -- docs/demos/)
          if [ -n "$changed" ]; then
            echo "::error::This PR changes docs/demos/, which is published to the docs site and cannot be scanned for personal data."
            printf '%s\n' "$changed" | sed 's/^/  /'
            echo "Run the 'Refresh screenshots' workflow instead; it captures against a seeded database and opens its own PR."
            exit 1
          fi
          echo "No docs/demos changes."


  commits:
    name: Commit messages + metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Also not skipped on forks: scan-commits.sh runs the shape rules with no
    # secret at all, and a contributor's commit message is precisely the text
    # worth checking. Only the denylist half needs the salt.
    steps:
      # The commits being scanned have to be present, and the default
      # fetch-depth of 1 leaves exactly one of them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out what is new
        id: range
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -n "$BASE" ]; then
            echo "range=$BASE..$HEAD" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0{40}$'; then
            echo "range=$BEFORE..$AFTER" >> "$GITHUB_OUTPUT"
          else
            # A brand new branch has no "before". Scan what it adds on top of
            # the default branch rather than every commit that ever existed.
            echo "range=origin/${{ github.event.repository.default_branch }}..$AFTER" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan commit messages, authors and committers
        env:
          PRISM_PII_SALT: ${{ secrets.PRISM_PII_SALT }}
          # This log is public. Report where a match is, never what it is.
          PRISM_SCAN_REDACT: "1"
        run: |
          # On a fork PR the salt is legitimately absent, and scan-commits.sh
          # runs the shape rules regardless. Anywhere else, a missing salt means
          # the denylist layer silently stopped working, which is a failure.
          if [ -z "$PRISM_PII_SALT" ] && [ "${{ github.event.pull_request.head.repo.fork }}" != "true" ]; then
            echo "::error::PRISM_PII_SALT is not set - the denylist layer could not run."
            exit 1
          fi
          bash scripts/scan-commits.sh "${{ steps.range.outputs.range }}"
