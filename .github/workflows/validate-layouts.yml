name: Validate Community Layouts

on:
  pull_request:
    paths:
      - 'community/layouts/**'
  push:
    branches:
      - master
    paths:
      - 'community/layouts/**'
  workflow_dispatch:

# Read-only token: no job here writes to the repo (CodeQL
# actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate community layouts
        run: npx tsx scripts/validate-community-layouts.ts
