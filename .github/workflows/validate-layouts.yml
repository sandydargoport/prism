name: Validate Community Layouts

on:
  pull_request:
    paths:
      - 'community/layouts/**'
  push:
    branches:
      - master
    paths:
      - 'community/layouts/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate community layouts
        run: npx tsx scripts/validate-community-layouts.ts
