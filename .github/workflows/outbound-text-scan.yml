name: Outbound text scan

# The gap every local hook leaves open.
#
# pre-commit covers tracked files, commit-msg covers commit messages, and the
# guard-outbound PreToolUse hook covers `gh` calls made from a Claude Code
# session. None of them can see text typed straight into github.com: a PR body,
# an issue comment, a release note, a squash-merge message typed in the merge
# box. That is how a contributor's email address reached a public issue body
# years after the scanners existed, and nothing noticed until an audit.
#
# This cannot stop the keystroke. It fails within seconds, while the body is
# still editable, which is the difference between a leak you fix and a leak you
# discover much later in a fork.
#
# It compares against .github/pii-hashes.txt, keyed by PRISM_PII_SALT, so the
# values themselves are never in the repo, never in a secret, and never printed
# into this public log.

on:
  pull_request:
    types: [opened, edited, reopened]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  release:
    types: [published, edited]
  # The rest of the places text becomes public. A review comment is the natural
  # place to paste a log excerpt, and Discussions are enabled on this repo, so
  # leaving these out left the most tempting surfaces ungated.
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  commit_comment:
    types: [created]
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]

permissions:
  contents: read

concurrency:
  group: outbound-${{ github.event_name }}-${{ github.event.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  scan:
    name: Outbound text scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A fork PR never receives secrets, so the salt would be empty and every run
    # would pass vacuously. Skip honestly rather than report a green check that
    # verified nothing.
    if: github.event.pull_request.head.repo.fork != true
    steps:
      - uses: actions/checkout@v7

      - name: Collect the submitted text
        env:
          TITLE: ${{ github.event.pull_request.title || github.event.issue.title || github.event.discussion.title || github.event.release.name }}
          BODY: ${{ github.event.pull_request.body || github.event.issue.body || github.event.comment.body || github.event.review.body || github.event.discussion.body || github.event.release.body }}
        run: |
          # Via the environment, never interpolated into the shell: the text is
          # attacker-controlled on a public repo.
          printf '%s\n%s\n' "$TITLE" "$BODY" > outbound.txt
          echo "Collected $(wc -c < outbound.txt) bytes."

      - name: Scan against the hashed denylist
        env:
          PRISM_PII_SALT: ${{ secrets.PRISM_PII_SALT }}
        run: |
          if [ -z "$PRISM_PII_SALT" ]; then
            # Fail closed: a warning that passes means a rotated or deleted
            # secret silently stops this check from checking anything, while
            # it still reports green. Fork PRs are already excluded above.
            echo "::error::PRISM_PII_SALT is not set - outbound text was not scanned."
            exit 1
          fi
          python3 scripts/pii-hashes.py scan-text outbound.txt

      - name: Scan against the built-in shape rules
        env:
          # Public log: report a position, never the value that matched.
          PRISM_SCAN_REDACT: "1"
        run: |
          # The hashed denylist above only knows the 25 values it was given. The
          # shape rules catch what nobody enrolled: an unfamiliar email address,
          # a private IP, a postal code, a coordinate pair. They need no secret,
          # so they are the half of the check that still works for everyone.
          bash scripts/scan-text.sh outbound.txt

      - name: Shred the collected text
        if: always()
        run: rm -f outbound.txt
