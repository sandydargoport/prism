name: Docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
      - 'overrides/**'
      - 'e2e-docs/**'
      - 'playwright.docs.config.ts'
      - 'README.md'
      - 'scripts/check-prose.py'
      - 'scripts/check-prose-allow.txt'
      - 'scripts/test_check_prose.py'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
      - 'overrides/**'
      - 'e2e-docs/**'
      - 'playwright.docs.config.ts'
      - 'README.md'
      - 'scripts/check-prose.py'
      - 'scripts/check-prose-allow.txt'
      - 'scripts/test_check_prose.py'
  workflow_dispatch:

# Least privilege by default; the deploy job elevates for itself.
permissions:
  contents: read

jobs:
  # Builds the site with --strict on every push AND pull request so broken
  # links / nav are caught before merge. Only master pushes upload the Pages
  # artifact for the deploy job; pull requests validate without publishing.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - run: pip install -r requirements-docs.txt

      - run: mkdocs build --strict

      # The README, the front page and every page in the menu stay free of
      # the patterns that read as machine-written (#1143): dashes, "not X but
      # Y" contrasts, hype words and two-word sentences. A hit that is right
      # as written goes in scripts/check-prose-allow.txt.
      - name: Check the writing
        run: |
          python3 -m unittest scripts/test_check_prose.py
          python3 scripts/check-prose.py

      # The front page is a custom template (overrides/home.html); measure
      # it in a browser so a layout break fails the PR, not the live site.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.docs.config.ts

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site

  # Publishes to GitHub Pages — never on pull requests.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
