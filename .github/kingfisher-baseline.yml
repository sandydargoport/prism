# Kingfisher baseline: findings reviewed once and accepted.
#
# All of these are the same three values wearing different commit hashes: the
# throwaway Postgres password the CI database used to have, the same password
# in the screenshots compose file, and a literal "Bearer YOUR_TOKEN" placeholder
# in the Home Assistant docs. Each was checked against the live instance's env
# and appears nowhere in it.
#
# A finding NOT in this file is new, and new is the only thing worth waking
# anyone for. Regenerate deliberately, never to silence something unexamined,
# from a clone whose origin is the GitHub URL (the repository id below must
# match, or nothing in this file applies):
#   kingfisher scan . --git-history full --no-validate --no-update-check \
#     --no-dedup --baseline-file .github/kingfisher-baseline.yml --manage-baseline
#
# --no-dedup matters. A normal scan reports one copy of each value, and which
# copy it picks varies between runs. A baseline built from a normal scan holds
# only the copies that run happened to pick, so the next run can pick an
# unlisted one and fail on a value that was already accepted. Building it with
# --no-dedup lists every copy, so any pick matches.
#
# The CI workflows no longer put a password in a connection URL, so editing
# them adds nothing here. Editing the screenshots compose file or those docs
# lines still creates a new copy and needs a regeneration.
